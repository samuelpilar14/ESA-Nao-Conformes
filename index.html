const ADMIN_UID="q8LLQjVaw5a6KPmx6QquT0DjRQW2",DOMAIN="@euroservice.pt",PERSONAL_EMAIL="14madman.s@gmail.com",SECTORS=["Som","Iluminação","Vídeo","Mobiliário","Logística"];

function today(){const d=new Date(),year=d.getFullYear(),month=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");return `${year}-${month}-${day}`}
function enforceDateLimit(input){const maximum=today();input.max=maximum;if(input.value&&input.value>maximum){input.value=maximum;alert("A data não pode ser futura.")}}
function applyDateLimits(){document.querySelectorAll('input[type="date"]').forEach(input=>{input.max=today();input.addEventListener("input",()=>enforceDateLimit(input));input.addEventListener("change",()=>enforceDateLimit(input))})}
function validPastOrToday(value){const normalized=String(value||"");return /^\d{4}-\d{2}-\d{2}$/.test(normalized)&&normalized<=today()}

async function registerAccount(event){event.preventDefault();setAuthMessage("");const form=event.target,f=new FormData(form),first=clean(f.get("firstName")),last=clean(f.get("lastName")),name=clean(first+" "+last),sector=String(f.get("sector")||""),email=norm(f.get("email")),password=String(f.get("password")||""),confirm=String(f.get("confirmPassword")||"");if(!first||!last)return setAuthMessage("Indica o primeiro e o último nome.");if(!validSector(sector))return setAuthMessage("Seleciona um setor válido.");if(!allowed(email))return setAuthMessage("O email não está autorizado.");if(password!==confirm)return setAuthMessage("As palavras-passe não coincidem.");registrationInProgress=true;try{const c=await createUserWithEmailAndPassword(auth,email,password);await updateProfile(c.user,{displayName:name});await set(ref(db,"users/"+c.user.uid),{name,email,sector,role:"technician",active:false,createdAt:now(),approvedAt:null,approvedBy:null});await sendEmailVerification(c.user);await signOut(auth);form.reset();showLoginTab();setAuthMessage("Conta criada. Verifica o email e aguarda aprovação.",true)}catch(e){console.error(e);setAuthMessage(e.code==="auth/email-already-in-use"?"Já existe uma conta com este email.":e.code==="auth/weak-password"?"A palavra-passe não cumpre os requisitos.":"Não foi possível criar a conta.")}finally{registrationInProgress=false}}
async function loginAccount(event){event.preventDefault();setAuthMessage("");const f=new FormData(event.target),email=norm(f.get("email")),password=String(f.get("password")||"");if(!allowed(email))return setAuthMessage("O email não está autorizado.");try{const c=await signInWithEmailAndPassword(auth,email,password);await reload(c.user);if(!c.user.emailVerified&&c.user.uid!==ADMIN_UID){try{await sendEmailVerification(c.user)}catch(e){console.error(e)}await signOut(auth);setAuthMessage("Email não verificado. Vai ao email verificar o spam.",true)}}catch(e){console.error(e);setAuthMessage("Email ou palavra-passe incorretos.")}}

function stopProcessListener(){if(unsubscribeProcesses){unsubscribeProcesses();unsubscribeProcesses=null}processes=[];selected=null;render()}function startProcessListener(){if(unsubscribeProcesses)unsubscribeProcesses();unsubscribeProcesses=onValue(processesRef,s=>{const d=s.val()||{};processes=Object.entries(d).map(([id,x])=>({...x,uuid:x.uuid||id})).sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));selected=selected?processes.find(x=>x.uuid===selected.uuid)||null:null;if(!selected)selected=processes.find(x=>!x.deleted)||null;setCloudStatus("Sincronizado às "+new Date().toLocaleTimeString("pt-PT"),"ok");render()},e=>{console.error(e);setCloudStatus("Erro de sincronização","error")})}

async function logoutAccount(){await signOut(auth)}async function checkApprovalAgain(){if(!auth.currentUser)return;currentProfile=await loadProfile(auth.currentUser);if(!currentProfile.active)return alert("A conta continua a aguardar aprovação.");location.reload()}
async function saveCloud(r){try{setCloudStatus("A guardar...");await set(ref(db,"processes/"+r.uuid),r);setCloudStatus("Guardado","ok");return true}catch(e){console.error(e);setCloudStatus("Erro ao guardar","error");alert("Não foi possível guardar.");return false}}
async function eventFor(r,d){if(!currentProfile?.active&&!isAdmin())return;const at=now();if(d.type==="status")r.status=d.status;if(d.type==="note")r.notes=[...(r.notes||[]),{text:d.text,at,createdBy:userInfo()}];if(d.type==="return"){r.version=(+r.version||1)+1;r.status="Em Reparação"}if(d.type==="close"){r.status="Reparado";r.repair=d.repair;r.repairTech=currentProfile.name;r.repairTechEmail=currentUser.email;r.repairTechUserId=currentUser.uid;r.repairDate=d.date}if(d.type==="delete"&&isAdmin())r.deleted=true;r.updatedAt=at;r.updatedBy=userInfo();selected=r.deleted?processes.find(x=>!x.deleted)||null:r;render();if(d.type==="return")printOne();await saveCloud(r)}

const SECT={Som:"SOM",Iluminação:"ILU",Vídeo:"VID",Mobiliário:"MOB",Logística:"LOG"};function nextRef(sector,dateValue){const pre=SECT[sector],date=/^\d{4}-\d{2}-\d{2}$/.test(dateValue||"")?dateValue:today(),prefix=`${pre}-AL-${date.slice(0,4)}.${date.slice(5,7)}.`,nums=processes.filter(x=>x.sector===sector&&!x.deleted&&(x.baseRef||"").startsWith(prefix)).map(x=>Number((x.baseRef||"").match(/\.(\d{3})$/)?.[1]||0));return prefix+String(Math.max(0,...nums)+1).padStart(3,"0")}
async function createProcess(event){event.preventDefault();const form=event.target,f=new FormData(form);if(!validPastOrToday(f.get("date")))return alert("A data não pode ser futura.");const r={uuid:uid(),baseRef:nextRef(f.get("sector"),f.get("date")),sector:f.get("sector"),equipment:f.get("equipment"),brand:f.get("brand"),model:f.get("model"),serial:f.get("serial"),detection:f.get("detection"),tech:currentProfile.name,techEmail:currentUser.email,techUserId:currentUser.uid,date:f.get("date"),issue:f.get("issue"),createdAt:now(),updatedAt:now(),notes:[],version:1,status:"Identificado",deleted:false,repair:"",repairTech:"",repairDate:"",createdBy:userInfo(),updatedBy:userInfo()};selected=r;closeM("newm");render();printOne();if(await saveCloud(r)){form.reset();form.elements.tech.value=currentProfile.name;form.elements.date.max=today();form.elements.date.value=today();if(validSector(currentProfile.sector))form.elements.sector.value=currentProfile.sector}}
function download(t,n,y){const b=new Blob([t],{type:y}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}function exportDatabase(){const stamp=now().replace(/:/g,"-").replace("T","_").slice(0,19);download(JSON.stringify({database:"noncon",schemaVersion:1,exportedAt:now(),processes},null,2),`noncon_backup_${stamp}.json`,"application/json")}
function render(){const live=processes.filter(x=>!x.deleted),qv=(el("q")?.value||"").toLowerCase(),sv=el("fs")?.value||"Todos",ev=el("fe")?.value||"Ativos",rows=live.filter(r=>(`${r.baseRef} ${r.equipment} ${r.brand} ${r.model} ${r.serial}`).toLowerCase().includes(qv)&&(sv==="Todos"||r.sector===sv)&&(ev==="Todos"||(ev==="Ativos"?r.status!=="Reparado":r.status===ev)));el("list").innerHTML=rows.map(r=>`<div class="row ${selected?.uuid===r.uuid?"active":""}" onclick="selectProcess('${r.uuid}')"><div><b>${esc(r.equipment)}</b><div class="small">${esc(r.sector)} · ${esc(r.baseRef)}.v${r.version} · ${esc(r.brand)} ${esc(r.model)}</div></div><span class="badge ${cls(r.status)}">${esc(r.status)}</span></div>`).join("")||'<div style="padding:32px;text-align:center;color:var(--muted)">Sem processos.</div>';["Identificado","Em Reparação","Recebido","Reparado"].forEach((s,i)=>el("n"+i).textContent=live.filter(r=>r.status===s).length);showDetail()}
function selectProcess(id){selected=processes.find(x=>x.uuid===id)||null;render()}function showDetail(){
  const r=selected,detailElement=el("detail");
  if(!r){detailElement.innerHTML="";return}
  const notes=(r.notes||[]).map(note=>{const noteDate=note.at?new Date(note.at).toLocaleString("pt-PT"):"",noteAuthor=note.createdBy?.name||note.createdBy||"",noteText=note.text||note;return `<div class="small">${esc(noteDate)} · ${esc(noteAuthor)} · ${esc(noteText)}</div>`}).join("");
  let actions="";
  if(r.status==="Identificado")actions=`<button type="button" class="btn" onclick="advanceProcess('Em Reparação')">Enviar para reparação</button>`;
  if(r.status==="Em Reparação")actions=`<button type="button" class="btn" onclick="advanceProcess('Recebido')">Marcar como recebido</button>`;
  if(r.status==="Recebido")actions=`<button type="button" class="btn" onclick="returnProcess()">Não conforme · devolver</button><button type="button" class="btn primary" onclick="openClose()">Está conforme · fechar</button>`;
  const repairSection=r.status==="Reparado"?`<div class="section"><b>Descrição da Reparação</b><p>${esc(r.repair)}</p><div class="small">${esc(r.repairTech)} · ${esc(r.repairDate)}</div></div>`:"";
  const deleteButton=isAdmin()?`<button type="button" class="btn danger" onclick="deleteProcess()">Eliminar processo</button>`:"";
  detailElement.innerHTML=`<div class="top"><div><b>${esc(r.baseRef)}.v${r.version}</b><h2>${esc(r.equipment)}</h2><div class="small">${esc(r.sector)} · ${esc(r.brand)} ${esc(r.model)}</div></div><span class="badge ${cls(r.status)}">${esc(r.status)}</span></div><div class="grid"><div><div class="label">Referência / N.º série</div>${esc(r.serial)}</div><div><div class="label">Deteção em</div>${esc(r.detection)}</div><div><div class="label">Técnico</div>${esc(r.tech)}</div><div><div class="label">Data</div>${esc(r.date)}</div></div><div class="section"><b>Descrição da Inconformidade</b><p>${esc(r.issue)}</p></div><div class="section"><b>Comentários / Notas</b>${notes}<textarea id="note" rows="3"></textarea><button type="button" class="btn" onclick="addNote()">Adicionar comentário</button></div>${repairSection}<div class="stack">${actions}<div class="pdfSplit" id="pdfSplit"><button type="button" class="btn" onclick="printOne()">Gerar PDF atual</button><button type="button" class="btn" onclick="event.stopPropagation();togglePdfHistory()">▾</button><div class="pdfHistory" id="pdfHistory"></div></div>${deleteButton}</div>`;
}
async function addNote(){const t=el("note").value.trim();if(t)await eventFor(selected,{type:"note",text:t})}function openNew(){if(!currentProfile?.active&&!isAdmin())return;const form=document.querySelector("#newm form");form.reset();form.elements.tech.value=currentProfile.name;form.elements.date.max=today();form.elements.date.value=today();if(validSector(currentProfile.sector))form.elements.sector.value=currentProfile.sector;el("newm").classList.add("open")}function openClose(){const form=document.querySelector("#closem form");form.reset();form.elements.tech.value=currentProfile.name;form.elements.date.max=today();form.elements.date.value=today();el("closem").classList.add("open")}function closeM(id){el(id).classList.remove("open")}async function closeRepair(event){event.preventDefault();const f=new FormData(event.target);if(!validPastOrToday(f.get("date")))return alert("A data não pode ser futura.");closeM("closem");await eventFor(selected,{type:"close",repair:f.get("repair"),date:f.get("date")});event.target.reset();printOne()}async function deleteProcess(){if(!isAdmin()||!selected)return;if(confirm(`Eliminar o processo ${selected.baseRef}.v${selected.version}?`))await eventFor(selected,{type:"delete"})}
function sectorOptions(selectedSector){return SECTORS.map(s=>`<option value="${esc(s)}" ${s===selectedSector?"selected":""}>${esc(s)}</option>`).join("")}async function openUserAdministration(){if(!isAdmin())return;el("usersm").classList.add("open");const snap=await get(usersRef),users=snap.val()||{};el("usersList").innerHTML=Object.entries(users).sort(([,a],[,b])=>Number(a.active)-Number(b.active)||String(a.name).localeCompare(String(b.name))).map(([id,p])=>`<div class="userAdminRow"><div><b>${esc(p.name)}</b><div class="small">${esc(p.email)}</div><div class="${p.active?"userActive":"userPending"}">${p.active?"Ativo":"Pendente"}</div></div><div class="userAdminControls"><select onchange="setUserSector('${id}',this.value)">${sectorOptions(p.sector)}</select>${id===ADMIN_UID?"":`<button class="btn ${p.active?"danger":"primary"}" onclick="setUserActive('${id}',${!p.active})">${p.active?"Desativar":"Aprovar"}</button>`}</div></div>`).join("")}async function setUserActive(id,active){if(!isAdmin())return;await update(ref(db,"users/"+id),{active,approvedAt:active?now():null,approvedBy:active?userInfo():null});await openUserAdministration()}async function setUserSector(id,sector){if(!isAdmin()||!validSector(sector))return;await update(ref(db,"users/"+id),{sector})}
function availablePdfPhases(r){const items=[{version:1,status:"Identificado",phase:"IDENTIFICADO",label:"v1 · Identificado"}];for(let v=1;v<=r.version;v++){items.push({version:v,status:"Em Reparação",phase:"ENVIADO-PARA-REPARACAO",label:`v${v} · Enviado para reparação`},{version:v,status:"Recebido",phase:"RECEBIDO",label:`v${v} · Recebido`});if(v<r.version)items.push({version:v+1,status:"Em Reparação",phase:"DEVOLVIDO",label:`v${v+1} · Devolvido`})}if(r.status==="Reparado")items.push({version:r.version,status:"Reparado",phase:"REPARADO",label:`v${r.version} · Reparado`});return items}function togglePdfHistory(){const box=el("pdfHistory"),split=el("pdfSplit");if(!box||!selected)return;box.innerHTML='<div class="pdfHistoryTitle">Regenerar fase</div>'+availablePdfPhases(selected).map((x,i)=>`<button onclick="regeneratePdf(${i})">${esc(x.label)}</button>`).join("");split.classList.toggle("open")}function regeneratePdf(i){const x=availablePdfPhases(selected)[i];if(x)preparePrint(sheet({...selected,version:x.version,status:x.status,_phase:x.phase}))}
function pdfFields(r){return[["Equipamento",r.equipment],["Marca",r.brand],["Modelo",r.model],["Referência / N.º Série",r.serial],["Deteção em",r.detection],["Técnico",r.tech],["Data",r.date],["Estado / Versão",r.status+" · v"+r.version]].map(x=>`<div class="pdfField"><div class="label">${esc(x[0])}</div><div>${esc(x[1])}</div></div>`).join("")}function copy(r,label){const notes=(r.notes||[]).map(n=>typeof n==="string"?n:n.text).filter(Boolean).join("\n"),repair=r.status==="Reparado"?`<div class="pdfSection"><b>Descrição da Reparação</b><div class="pdfBlock">${esc(r.repair||"")}</div><div><b>Técnico:</b> ${esc(r.repairTech||"")} · <b>Data:</b> ${esc(r.repairDate||"")}</div></div>`:"";return`<div class="copy"><div class="pdfHeader"><div><b>Ficha de Identificação de Equipamento Não Conforme</b><div>${esc(r.sector)}</div><div>${esc(r.baseRef)}.v${r.version}</div></div><div class="logoBox"><img src="logo-empresa.png"><div class="algarve">ALGARVE</div></div></div><div class="copyType">${esc(label)}</div><div class="pdfTitle">NÃO CONFORME</div><div class="pdfGrid">${pdfFields(r)}</div><div class="pdfSection"><b>Descrição da Inconformidade</b><div class="pdfBlock">${esc(r.issue)}</div></div>${notes?`<div class="pdfSection"><b>Comentários / Notas</b><div class="pdfBlock">${esc(notes)}</div></div>`:""}${repair}<div class="sign">Assinatura</div></div>`}function sheet(r){const p=r._phase?" · "+r._phase.replaceAll("-"," "):"";return`<article class="a4">${copy(r,"PARA REPARAÇÃO"+p)}${copy(r,"CÓPIA INTERNA"+p)}</article>`}function preparePrint(h){el("pdf").innerHTML=h;el("pdf").className="pdf print-active";setTimeout(()=>window.print(),300)}function printOne(){if(selected)preparePrint(sheet(selected))}function printAll(by){let rows=processes.filter(r=>!r.deleted);if(by)rows.sort((a,b)=>a.sector.localeCompare(b.sector)||a.baseRef.localeCompare(b.baseRef));preparePrint(rows.map(sheet).join(""))}
function exportExcel(by){const live=processes.filter(x=>!x.deleted),cols=["Processo","Setor","Equipamento","Marca","Modelo","Referência / N.º Série","Deteção em","Técnico","Data","Estado","Versão","Inconformidade","Reparação"],row=r=>[r.baseRef+".v"+r.version,r.sector,r.equipment,r.brand,r.model,r.serial,r.detection,r.tech,r.date,r.status,r.version,r.issue,r.repair],table=a=>[cols,...a.map(row)].map(z=>"<Row>"+z.map(v=>'<Cell><Data ss:Type="String">'+esc(v)+"</Data></Cell>").join("")+"</Row>").join(""),sheets=by?[...new Set(live.map(r=>r.sector))].map(sec=>`<Worksheet ss:Name="${esc(sec)}"><Table>${table(live.filter(r=>r.sector===sec))}</Table></Worksheet>`).join(""):`<Worksheet ss:Name="Todos"><Table>${table(live)}</Table></Worksheet>`,xml=`<?xml version="1.0"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">${sheets}</Workbook>`;download(xml,"noncon_"+today()+".xls","application/vnd.ms-excel")}
applyDateLimits();
Object.assign(window,{showLoginTab,showRegisterTab,registerAccount,loginAccount,logoutAccount,checkApprovalAgain,openUserAdministration,setUserActive,setUserSector,exportDatabase,printAll,exportExcel,openNew,createProcess,closeRepair,closeM,render,eventFor,advanceProcess,returnProcess,openClose,addNote,printOne,togglePdfHistory,regeneratePdf,selectProcess,deleteProcess});document.addEventListener("click",()=>{el("exp")?.classList.remove("open");el("pdfSplit")?.classList.remove("open")});
