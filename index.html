function selectProcess(id){selected=processes.find(x=>x.uuid===id)||null;render()}function showDetail(){const r=selected;if(!r){detail.innerHTML="";return}const notes=(r.notes||[]).map(n=>`<div class="small">${n.at?new Date(n.at).toLocaleString("pt-PT"):""} · ${esc(n.createdBy?.name||n.createdBy||"")} · ${esc(n.text||n)}</div>`).join(""),act=r.status==="Identificado"?'<button class="btn" onclick="eventFor(selected,{type:\'status\',status:\'Em Reparação\'})">Enviar para reparação</button>':r.status==="Em Reparação"?'<button class="btn" onclick="eventFor(selected,{type:\'status\',status:\'Recebido\'})">Marcar como recebido</button>':r.status==="Recebido"?'<button class="btn" onclick="eventFor(selected,{type:\'return\'})">Não conforme · devolver</button><button class="btn primary" onclick="openClose()">Está conforme · fechar</button>':"";detail.innerHTML=`<div class="top"><div><b>${esc(r.baseRef)}.v${r.version}</b><h2>${esc(r.equipment)}</h2><div class="small">${esc(r.sector)} · ${esc(r.brand)} ${esc(r.model)}</div></div><span class="badge ${cls(r.status)}">${esc(r.status)}</span></div><div class="grid"><div><div class="label">Referência / N.º série</div>${esc(r.serial)}</div><div><div class="label">Deteção em</div>${esc(r.detection)}</div><div><div class="label">Técnico</div>${esc(r.tech)}</div><div><div class="label">Data</div>${esc(r.date)}</div></div><div class="section"><b>Descrição da Inconformidade</b><p>${esc(r.issue)}</p></div><div class="section"><b>Comentários / Notas</b>${notes}<textarea id="note" rows="3"></textarea><button class="btn" onclick="addNote()">Adicionar comentário</button></div>${r.status==="Reparado"?`<div class="section"><b>Descrição da Reparação</b><p>${esc(r.repair)}</p><div class="small">${esc(r.repairTech)} · ${esc(r.repairDate)}</div></div>`:""}<div class="stack">${act}<div class="pdfSplit" id="pdfSplit"><button class="btn" onclick="printOne()">Gerar PDF atual</button><button class="btn pdfArrow" onclick="event.stopPropagation();togglePd async function addNote(){const t=note.value.trim();if(t)await eventFor(selected,{type:"note",text:t})}function openNew(){if(!currentProfile?.active&&!isAdmin())return;const form=document.querySelector("#newm form");form.reset();form.elements.tech.value=currentProfile.name;form.elements.date.value=today();newm.classList.add("open")}function openClose(){const form=document.querySelector("#closem form");form.reset();form.elements.tech.value=currentProfile.name;form.elements.date.value=today();closem.classList.add("open")}function closeM(id){document.getElementById(id).classList.remove("open")}async function closeRepair(e){e.preventDefault();const f=new FormData(e.target);closeM("closem");await eventFor(selected,{type:"close",repair:f.get("repair"),date:f.get("date")});e.target.reset();printOne()}async function deleteProcess(){if(!isAdmin()||!selected)return;if(confirm("Eliminar este processo?"))await eventFor(selected,{type:"delete"})}

function availablePdfPhases(r){const items=[{version:1,status:"Identificado",phase:"IDENTIFICADO",label:"v1 · Identificado"}];for(let v=1;v<=r.version;v++){items.push({version:v,status:"Em Reparação",phase:"ENVIADO-PARA-REPARACAO",label:`v${v} · Enviado para reparação`},{version:v,status:"Recebido",phase:"RECEBIDO",label:`v${v} · Recebido`});if(v<r.version)items.push({version:v+1,status:"Em Reparação",phase:"DEVOLVIDO",label:`v${v+1} · Devolvido`})}if(r.status==="Reparado")items.push({version:r.version,status:"Reparado",phase:"REPARADO",label:`v${r.version} · Reparado`});const seen=new Set;return items.filter(x=>{const k=x.version+"|"+x.phase;if(seen.has(k))return false;seen.add(k);return true})}function togglePdfHistory(){const box=document.getElementById("pdfHistory"),split=document.getElementById("pdfSplit");if(!box||!selected)return;box.innerHTML='<div class="pdfHistoryTitle">Regenerar fase</div>'+availablePdfPhases(selected).map((x,i)=>`<button onclick="regeneratePdf(${i})">${esc(x.label)}</button>`).join("");split.classList.toggle("open")}function regeneratePdf(i){const x=availablePdfPhases(selected)[i];if(x)preparePrint(sheet({...selected,version:x.version,status:x.status,_phase:x.phase}))}
